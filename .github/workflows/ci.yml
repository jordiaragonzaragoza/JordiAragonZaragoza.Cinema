name: Build, Test, and SonarCloud Analysis on .NET Core

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze
        run: |
          dotnet sonarscanner begin \
            /k:"jordiaragonzaragoza_JordiAragon.Cinema" \
            /o:"jordiaragonzaragoza" \
            /d:sonar.token=$SONAR_TOKEN \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.verbose=true \
            /d:sonar.projectKey="jordiaragonzaragoza_JordiAragon.Cinema" \
            /d:sonar.dotnet.excludeTestProjects=true \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

          dotnet restore JordiAragonZaragoza.Cinema.sln
          dotnet build JordiAragonZaragoza.Cinema.sln --no-restore --configuration Release
          dotnet test JordiAragonZaragoza.Cinema.sln --no-restore --configuration Release --collect:"XPlat Code Coverage;Format=opencover"

          dotnet sonarscanner end /d:sonar.token=$SONAR_TOKEN
